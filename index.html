<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة قيد الصيانة 🛠️</title>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* الألوان المستخدمة مستوحاة من تصميمك */
        :root {
            --bg-color: #0a0a0a;
            --card-color: #1e1e1e;
            --primary: #1877F2; /* الأزرق */
            --error: #f44336; /* الأحمر */
            --text-color: #ffffff;
            --text-secondary: #b0b0b0;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* تنسيق عام للجسم */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Almarai', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden; /* لمنع ظهور أشرطة التمرير */
        }

        /* حاوية الرسالة الرئيسية */
        .maintenance-container {
            background: var(--card-color);
            padding: 4rem 3rem;
            border-radius: 20px;
            box-shadow: var(--shadow);
            max-width: 600px;
            width: 90%;
            border: 2px solid var(--primary);
            position: relative;
            animation: fadeIn 1s ease-out;
        }

        /* تنسيق الأيقونة */
        .icon-box {
            font-size: 5rem;
            color: var(--primary);
            margin-bottom: 2rem;
            animation: spin 3s linear infinite; /* حركة دوران */
            display: inline-block;
            text-shadow: 0 0 15px rgba(24, 119, 242, 0.5);
        }
        
        /* تأثير النبض على الأيقونة */
        .icon-pulse {
             animation: pulse 2s infinite ease-in-out;
        }

        /* العنوان الرئيسي */
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: var(--text-color);
        }

        /* الرسالة الفرعية */
        p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.8;
        }
        
        /* رابط التواصل */
        .contact-link {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(24, 119, 242, 0.4);
        }

        .contact-link:hover {
            background: #3B90F5;
            transform: translateY(-3px) scale(1.02);
        }

        /* تأثيرات الحركة (الأنيميشن) */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* الاستجابة للهواتف الصغيرة */
        @media (max-width: 600px) {
            .maintenance-container {
                padding: 3rem 1.5rem;
            }
            h1 {
                font-size: 2rem;
            }
            p {
                font-size: 1rem;
            }
            .icon-box {
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        
        <div class="icon-box">
            <i class="fas fa-tools icon-pulse"></i>
        </div>

        <h1>المنصة قيد الصيانة والتحديث 🚧</h1>

        <p>
            نعتذر عن توقف الخدمة بشكل مؤقت. نحن نعمل حالياً على إضافة ميزات جديدة وتحسين أداء المنصة لضمان أفضل تجربة تعليمية لك.
        </p>

        <p style="font-size: 1rem; color: var(--error); font-weight: 700;">
            من المتوقع أن تعود المنصة للعمل خلال فترة وجيزة.
        </p>

        <a href="https://wa.me/9647709014600" target="_blank" class="contact-link">
            <i class="fab fa-whatsapp"></i> تواصل معنا للاستفسار
        </a>

        <p style="margin-top: 2rem; font-size: 0.9rem; color: var(--text-secondary);">
            الأستاذ: حيدر علي الطائي
        </p>

    </div>

</body>
</html>
