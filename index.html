<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة تحت الصيانة</title>
    <style>
        /* التنسيقات الأساسية */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4; /* خلفية فاتحة */
            color: #333; /* لون النص */
            display: flex; /* لمركزة المحتوى */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        /* حاوية الرسالة والصورة */
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            width: 500px;
        }

        /* تنسيق الصورة */
        .maintenance-image {
            width: 100%; /* اجعل الصورة تتناسب مع عرض الحاوية */
            height: auto;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 3px solid #007bff; /* إطار أزرق حول الصورة */
        }

        /* تنسيق العنوان */
        h1 {
            color: #dc3545; /* لون أحمر للتنبيه */
            margin-bottom: 15px;
            font-size: 2.5em;
        }

        /* تنسيق النص */
        p {
            font-size: 1.2em;
            line-height: 1.6;
            color: #6c757d;
        }

        /* لتمييز بعض النصوص */
        .highlight {
            font-weight: bold;
            color: #007bff; /* لون أزرق للتركيز */
        }

        /* رسالة إضافية أسفل */
        .footer-message {
            margin-top: 30px;
            font-size: 0.9em;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://j.top4top.io/p_35975xwkj1.png" alt="صورة الأستاذ حيدر علي الطائي" class="maintenance-image">

        <h1>عذراً، المنصة تحت الصيانة!</h1>
        <p>
            نعمل حالياً على تطوير وتحسين <span class="highlight">المنصة التعليمية</span> لتقديم أفضل تجربة ممكنة.
        </p>
        <p>
            نعتذر عن أي إزعاج. يرجى المحاولة مرة أخرى قريباً.
        </p>
    </div>

    <p class="footer-message">
        شكراً لتفهمكم وصبركم.
    </p>

</body>
</html>
