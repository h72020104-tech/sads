<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة تحت الصيانة الآن</title>
    <style>
        /* التنسيقات لضمان سرعة التحميل وعرض الصورة كخلفية */
        body {
            /* 1. استخدام الصورة كخلفية للصفحة بالكامل */
            background-image: url('https://j.top4top.io/p_35975xwkj1.png');
            background-size: cover; /* لضمان تغطية الصورة للصفحة بالكامل */
            background-position: center; /* لمركزة الصورة */
            background-repeat: no-repeat; /* عدم تكرار الصورة */
            
            /* 2. تنسيقات النص ليكون واضحاً فوق الخلفية */
            font-family: 'Arial', sans-serif;
            color: #ffffff; /* لون أبيض للنص لتباين قوي */
            text-align: center;
            
            /* 3. لمركزة النص في منتصف الشاشة */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            
            /* 4. إضافة طبقة شفافة للتعتيم وجعل النص مقروءاً بوضوح */
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6); /* طبقة تعتيم سوداء شفافة بنسبة 60% */
            z-index: 1; /* وضعها خلف النص */
        }
        
        /* تنسيق محتوى الرسالة */
        .content {
            position: relative; /* لجعله فوق طبقة التعتيم (z-index: 2) */
            z-index: 2;
            padding: 20px;
        }

        h1 {
            font-size: 3.5em; /* خط كبير جداً */
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px #000000; /* ظل لزيادة وضوح العنوان */
            color: #ffc107; /* لون مميز (أصفر/ذهبي) */
        }

        p {
            font-size: 1.5em;
            line-height: 1.6;
            max-width: 600px;
            text-shadow: 1px 1px 2px #000000;
        }

        .highlight {
            font-weight: bold;
            color: #17a2b8; /* لون ثانوي مميز */
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>🛠️ المنصة قيد التحديث والصيانة 🛠️</h1>
        <p>
            نحن نعمل بجد لإطلاق <span class="highlight">أقوى وأحدث نسخة</span> من المنصة التعليمية. 
        </p>
        <p>
            سنعود في أقرب وقت ممكن مع تجربة تعلم مطورة. شكراً جزيلاً لصبركم!
        </p>
    </div>

</body>
</html>
