<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأستاذ حيدر علي الطائي - تحت الصيانة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #00d4ff;
            --bg-dark: #0f172a;
            --text-light: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text-light);
            padding: 20px;
        }

        /* تأثيرات الخلفية المتحركة */
        .background-blobs {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            background: var(--primary-color);
            filter: blur(80px);
            border-radius: 50%;
            opacity: 0.2;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(20%, 20%); }
        }

        /* حاوية التصميم الرئيسية */
        .maintenance-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px 20px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-container {
            margin-bottom: 25px;
        }

        .gear-icon {
            font-size: 60px;
            animation: spin 4s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 15px;
            background: linear-gradient(to left, #fff, var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.8;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .status-badge {
            background: rgba(0, 212, 255, 0.1);
            color: var(--secondary-color);
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        /* تخصيص الموبايل */
        @media (max-width: 480px) {
            h1 { font-size: 1.5rem; }
            p { font-size: 1rem; }
            .maintenance-card { padding: 30px 15px; }
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.8rem;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="background-blobs">
        <div class="blob" style="width: 300px; height: 300px; top: -50px; right: -50px;"></div>
        <div class="blob" style="width: 250px; height: 250px; bottom: -50px; left: -100px; background: #6366f1;"></div>
    </div>

    <div class="maintenance-card">
        <div class="icon-container">
            <span class="gear-icon">⚙️</span>
        </div>
        
        <div class="status-badge">نعمل على التطوير</div>
        
        <h1>منصة الأستاذ حيدر علي الطائي</h1>
        
        <p>عذراً أعزائنا الطلبة، المنصة حالياً تحت الصيانة الدورية لضمان تقديم أفضل تجربة تعليمية لكم.</p>
        
        <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
            <p style="margin-bottom: 0; font-weight: 700;">سنعود إليكم قريباً جداً!</p>
        </div>

        <div class="footer-note">جميع الحقوق محفوظة © 2026</div>
    </div>

</body>
</html>
