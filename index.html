<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأستاذ حيدر | قريباً</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* إعدادات الصفحة الأساسية */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            font-family: 'Tajawal', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* الخلفية المتحركة (تأثير ضوئي) */
        body::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
            animation: pulseBackground 10s infinite alternate;
            z-index: -1;
        }

        /* البطاقة الزجاجية */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            color: #fff;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 
                        0 0 15px rgba(212, 175, 55, 0.1) inset;
            transform: translateY(20px);
            opacity: 0;
            animation: floatUp 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* الأيقونة العلوية */
        .icon-container {
            font-size: 3rem;
            color: #d4af37;
            margin-bottom: 1.5rem;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            animation: floatIcon 3s ease-in-out infinite;
        }

        /* النصوص */
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #ffffff, #d4af37, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 200% auto;
            animation: shineText 5s linear infinite;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #ccc;
            margin-bottom: 2rem;
            font-weight: 300;
            line-height: 1.6;
        }

        /* شريط التحميل الفخم */
        .loader-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            margin-top: 2rem;
        }

        .loader-bar {
            height: 100%;
            width: 50%;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            position: absolute;
            animation: loading 2s infinite ease-in-out;
            box-shadow: 0 0 10px #d4af37;
        }

        /* الحالة (تحت الصيانة) */
        .status-badge {
            display: inline-block;
            margin-top: 2rem;
            padding: 8px 20px;
            border: 1px solid #d4af37;
            color: #d4af37;
            border-radius: 50px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .status-badge:hover {
            background: #d4af37;
            color: #000;
            cursor: default;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        /* Animations Keyframes */
        @keyframes floatUp {
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes pulseBackground {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0.8; }
        }

        @keyframes shineText {
            to { background-position: 200% center; }
        }

        @keyframes loading {
            0% { left: -50%; }
            100% { left: 100%; }
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* استجابة للشاشات الصغيرة */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .glass-card { padding: 2rem; width: 85%; }
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="icon-container">
            <i class="fas fa-graduation-cap"></i>
        </div>

        <h1>منصة الأستاذ حيدر</h1>
        
        <p class="subtitle">
            نعمل حالياً بجد خلف الكواليس لتجهيز تجربة تعليمية استثنائية تليق بطموحاتكم.
            <br>
            سنكون متاحين قريباً جداً.
        </p>

        <div class="loader-container">
            <div class="loader-bar"></div>
        </div>

        <div class="status-badge">
            <i class="fas fa-tools"></i> الموقع تحت الصيانة
        </div>
    </div>

</body>
</html>
