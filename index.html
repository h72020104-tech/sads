<!doctype html>
<html lang="ar" dir="rtl">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنصة تحت الصيانة - منصة التفوق</title>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* المتغيرات الأساسية */
    :root {
      --bg-color: #0a0a0a;
      --primary-color: #ffc107; /* لون تحذيري قوي */
      --secondary-color: #1a1a1a;
      --text-color: #ffffff;
      --text-secondary: #aaaaaa;
    }

    /* التنسيق العام */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Almarai', sans-serif;
    }

    body, html {
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden; /* لمنع ظهور شريط التمرير */
    }

    /* حاوية الصيانة الرئيسية */
    .maintenance-container {
      text-align: center;
      padding: 2rem;
      border-radius: 20px;
      background: var(--secondary-color);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), 0 0 0 5px var(--primary-color); /* ظل قوي ومحيط مميز */
      position: relative;
      z-index: 10;
      max-width: 500px;
      width: 90%;
      transform: translateY(0);
      animation: shake 2s infinite cubic-bezier(0.68, -0.55, 0.27, 1.55);
      animation-iteration-count: 1; /* التشغيل مرة واحدة فقط لتأثير الدخول */
    }
    
    /* تأثير الاهتزاز عند الدخول */
    @keyframes shake {
      0% { transform: scale(0.8) rotate(0deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    /* الأيقونة الدوارة (أداة العمل) */
    .maintenance-icon {
      font-size: 5rem;
      color: var(--primary-color);
      margin-bottom: 1.5rem;
      animation: rotate 2s linear infinite; /* تدوير مستمر */
      display: inline-block;
      text-shadow: 0 0 10px rgba(255, 193, 7, 0.5);
    }
    
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* العناوين */
    h2 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      color: var(--text-color);
    }

    h3 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 1rem;
    }
    
    p {
      color: var(--text-secondary);
      font-size: 1.1rem;
      line-height: 1.8;
      margin-bottom: 2rem;
    }

    /* شريط التقدم الوهمي */
    .progress-bar-container {
        width: 100%;
        height: 15px;
        background: #333;
        border-radius: 8px;
        overflow: hidden;
        margin-top: 2rem;
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
    }

    .progress-bar {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #ff9800, #ffc107);
        animation: progress 5s infinite linear;
        border-radius: 8px;
    }
    
    /* حركة شريط التقدم الوهمي */
    @keyframes progress {
        0% { width: 0%; }
        50% { width: 85%; } /* يبقى عند 85% ليعطي إيحاء بأن العمل لم ينته بعد */
        100% { width: 0%; }
    }
    
    /* تأثير الضوء المحيط (خلفية ديناميكية) */
    .glow-effect {
        position: absolute;
        width: 150px;
        height: 150px;
        background: var(--primary-color);
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.2;
        animation: floatingGlow 15s infinite ease-in-out;
        z-index: 5;
    }

    .glow-effect:nth-child(2) {
        width: 100px;
        height: 100px;
        background: #4caf50;
        animation-delay: -5s;
    }

    @keyframes floatingGlow {
        0% { transform: translate(50%, 50%); }
        30% { transform: translate(-50%, 20%); }
        60% { transform: translate(10%, -30%); }
        100% { transform: translate(50%, 50%); }
    }

  </style>
 </head>
 <body> 
  
  <div class="glow-effect" style="top: 10%; left: 10%;"></div>
  <div class="glow-effect" style="bottom: 5%; right: 5%;"></div>

  <div class="maintenance-container">
    
    <i class="fas fa-tools maintenance-icon"></i>

    <h2>منصة التفوق</h2>
    <h3>المنصة تحت الصيانة</h3>
    
    <p>
      نعتذر عن الإزعاج، نحن نعمل حالياً على **تحديث شامل وضروري** لتطوير المنصة وتحسين الأداء. 
      <br>
      الرجاء المحاولة لاحقاً.
    </p>

    <div class="progress-bar-container">
        <div class="progress-bar"></div>
    </div>
    
  </div>

 </body>
</html>
