<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة تحت الصيانة - نعود قريباً</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* 1. التنسيقات الأساسية والتصميم القوي */
        :root {
            --primary-color: #1a237e; /* أزرق داكن أساسي */
            --accent-color: #ffc107; /* أصفر ذهبي مميز */
            --text-color: #ffffff;
            --background-gradient: linear-gradient(135deg, #0f1c30 0%, #1a237e 100%);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--background-gradient);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        .maintenance-container {
            padding: 40px 30px;
            border-radius: 12px;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            max-width: 700px;
            width: 90%;
            position: relative;
        }

        /* 2. تصميم الأيقونة المتحركة */
        .icon-gear {
            font-size: 4.5em;
            margin-bottom: 25px;
            color: var(--accent-color);
            animation: spin 6s linear infinite; /* تأثير دوران جذاب */
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 2.8em;
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        /* 3. تصميم العداد التنازلي (أقوى جزء في التصميم) */
        #countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 8px;
            min-width: 80px;
            border-left: 3px solid var(--accent-color);
        }

        .time-value {
            font-size: 2.5em;
            font-weight: bold;
            color: var(--text-color);
        }

        .time-label {
            font-size: 0.8em;
            margin-top: 5px;
            opacity: 0.7;
        }

        /* 4. التجاوب مع الشاشات الصغيرة */
        @media (max-width: 600px) {
            h1 { font-size: 2em; }
            p { font-size: 1em; }
            .time-unit { min-width: 60px; padding: 10px; }
            .time-value { font-size: 2em; }
            .icon-gear { font-size: 3.5em; }
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        
        <i class="fas fa-tools icon-gear"></i>
        
        <h1>عفواً، المنصة قيد الصيانة</h1>
        <p>نعمل حالياً على تحديث المنصة وتحسين الأداء لضمان حصولك على أفضل تجربة ممكنة. شكراً لتفهمك وصبرك.</p>
        
        <h2>سنعود إليكم خلال:</h2>
        <div id="countdown">
            <div class="time-unit">
                <span class="time-value" id="days">00</span>
                <span class="time-label">أيام</span>
            </div>
            <div class="time-unit">
                <span class="time-value" id="hours">00</span>
                <span class="time-label">ساعات</span>
            </div>
            <div class="time-unit">
                <span class="time-value" id="minutes">00</span>
                <span class="time-label">دقائق</span>
            </div>
            <div class="time-unit">
                <span class="time-value" id="seconds">00</span>
                <span class="time-label">ثواني</span>
            </div>
        </div>
        
        </div>

    <script>
        // 4. كود JavaScript للمؤقت التنازلي
        
        // **قم بتعديل هذا التاريخ إلى تاريخ ووقت انتهاء الصيانة**
        // (تنسيق التاريخ والوقت: Month Day, Year Hour:Minute:Second)
        const countdownDate = new Date("November 15, 2025 10:00:00").getTime();

        const x = setInterval(function() {
            // الحصول على وقت وتاريخ اليوم
            const now = new Date().getTime();
            
            // حساب المسافة بين الآن والتاريخ المحدد
            const distance = countdownDate - now;

            // حساب الوقت لكل وحدة
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            // عرض النتائج في العناصر المخصصة
            document.getElementById("days").innerHTML = (days < 10 ? "0" : "") + days;
            document.getElementById("hours").innerHTML = (hours < 10 ? "0" : "") + hours;
            document.getElementById("minutes").innerHTML = (minutes < 10 ? "0" : "") + minutes;
            document.getElementById("seconds").innerHTML = (seconds < 10 ? "0" : "") + seconds;

            // عندما ينتهي العد التنازلي
            if (distance < 0) {
                clearInterval(x);
                document.getElementById("countdown").innerHTML = "<h1>المنصة عادت للعمل!</h1>";
                document.getElementById("countdown").style.color = "var(--accent-color)";
            }
        }, 1000);
    </script>
</body>
</html>
