<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحت الصيانة الآن | Maintenance Mode</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* الأنماط القوية والداكنة */
        body {
            background-color: #1a1a2e; /* خلفية داكنة (كحلي غامق) */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            padding: 40px;
            background: rgba(0, 0, 0, 0.4); /* شبه شفاف لعمق بصري */
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
        }

        /* عنوان قوي وبارز */
        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: #e94560; /* لون التنبيه القوي (أحمر ناري) */
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.8);
        }

        /* رسالة قوية واحترافية */
        p {
            font-size: 1.4rem;
            max-width: 600px;
            margin: 0 auto 30px;
            color: #a4a4d7; /* لون ثانوي هادئ ومقروء */
        }

        /* أيقونة الترس المتحركة */
        .maintenance-icon {
            font-size: 5rem;
            color: #16c79a; /* لون أخضر تكنولوجي (نيون) */
            margin-bottom: 25px;
            animation: spin 3s linear infinite; /* حركة دوران مستمرة */
        }

        /* حركة الدوران للترس */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* رسالة تقدير وقت العودة */
        .countdown {
            font-size: 1.2rem;
            color: #f7b32b; /* لون ذهبي للوقت */
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <i class="fas fa-cog maintenance-icon"></i>

        <h1>المنصة تحت الصيانة الآن</h1>
        
        <p>
            نعتذر عن الإزعاج! فريق العمل يجري الآن تحديثات هيكلية على الكود والأنظمة. هذه الخطوة ضرورية لضمان حصولك على تجربة أقوى وأسرع وأكثر أماناً.
        </p>
        
        <div class="countdown">
            نتوقع العودة خلال بضع ساعات...
        </div>
    </div>

</body>
</html>
