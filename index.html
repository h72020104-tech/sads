<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة تحت الصيانة 🚧</title>
    <style>
        /* الأنماط (CSS) */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f6; /* لون خلفية فاتح */
            color: #333; /* لون النص الأساسي */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            direction: rtl; /* لدعم اللغة العربية */
        }

        .container {
            background-color: #ffffff; /* خلفية بيضاء للمحتوى */
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); /* ظل خفيف لإضافة عمق */
            max-width: 600px;
            width: 90%;
        }

        h1 {
            color: #007bff; /* لون أزرق جذاب للعنوان */
            font-size: 2.5em;
            margin-bottom: 15px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
            display: inline-block;
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .countdown {
            font-size: 1.5em;
            color: #dc3545; /* لون أحمر للتأكيد */
            font-weight: bold;
            margin-top: 20px;
        }

        .icon {
            font-size: 3em;
            margin-bottom: 20px;
            color: #ffc107; /* لون أصفر للتحذير */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚧</div>
        <h1>المنصة تحت الصيانة الآن</h1>
        <p>
            نعتذر عن أي إزعاج. نحن نعمل حالياً على تحسين وتطوير المنصة لتقديم أفضل تجربة لك.
        </p>
        <p>
            سنعود للعمل قريباً بأداء أفضل وميزات جديدة.
        </p>
        <div class="countdown">
            شكراً لتفهمكم وصبركم!
            </div>
        <p style="font-size: 0.9em; margin-top: 30px; color: #6c757d;">
            للاستفسارات الطارئة، يرجى التواصل مع فريق الدعم.
        </p>
    </div>
</body>
</html>
